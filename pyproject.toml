[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gridlake"
version = "0.1.0"
description = "Production-grade, AI-ready energy grid lakehouse: Iceberg medallion pipeline, data contracts, quality gates, OpenLineage, knowledge graph and RAG retrieval layer. Runs locally; deploys to AWS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyiceberg[pyarrow,sql-sqlite,pyiceberg-core]>=0.10,<1.0",
  "pyarrow>=16",
  "duckdb>=1.1",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
aws = ["pyiceberg[glue]>=0.10,<1.0", "boto3>=1.34"]  # S3 I/O goes through pyarrow FileIO
agent = ["anthropic[bedrock]>=2.3", "boto3>=1.34"]  # Claude on Amazon Bedrock for `gridlake ask --llm bedrock`
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
gridlake = "gridlake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gridlake"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "gridlake/_contracts"
"seeds" = "gridlake/_seeds"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
