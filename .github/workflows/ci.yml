name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=gridlake --cov-report=term-missing --cov-report=xml
      - name: Grid anomaly watcher explains planted grid events
        env:
          GRIDLAKE_HOME: .gridlake-events
        run: |
          gridlake run --end 2026-10-15 --days 14 --no-telemetry --grid-events
          gridlake watch --date 2026-10-14 --trace | tee brief.txt
          grep -q "| high | ERCO | demand |" brief.txt
          grep -q "not anticipated" brief.txt
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  pipeline-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run the full pipeline twice (second run must be a no-op)
        run: |
          gridlake run --end 2026-10-15 --days 14
          gridlake run --end 2026-10-15 --days 14 --no-telemetry --reconcile
      - run: gridlake quality
      - run: gridlake lineage
      - run: gridlake ask "What was the renewable share for CAISO on 2026-10-10?"
      - name: Data reliability agent triages an injected fault
        env:
          GRIDLAKE_HOME: .gridlake-incident
        run: |
          gridlake run --end 2026-10-15 --days 7 --inject-fault unit_change
          gridlake triage --trace | tee triage.txt
          grep -q source_data_defect triage.txt
          gridlake incidents list
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-layer
          path: |
            .gridlake/knowledge/*.ttl
            .gridlake/knowledge/graph.nt
            .gridlake/lineage/
            .gridlake/runs/

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gridlake:ci .
      - name: Containerised smoke run
        run: docker run --rm gridlake:ci run --end 2026-10-15 --days 3 --telemetry-hours 1
      - run: docker build -f Dockerfile.lambda -t gridlake-lambda:ci .
