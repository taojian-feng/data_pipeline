name: deploy

# terraform plan on demand; apply only after a reviewer approves the "aws-dev" environment.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan after approval (otherwise plan only)
        type: boolean
        default: false
      region:
        description: AWS region (must be where the bootstrap stack and state bucket live)
        default: us-east-2

permissions:
  contents: read
  id-token: write # OIDC token for AWS, no stored keys

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: aws-dev
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@v4
      - name: Show OIDC claims AWS will check (the token itself is not printed)
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, repository, environment}' || true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=gridlake/dev.tfstate"
          -backend-config="region=${{ inputs.region }}"
      - run: terraform plan -input=false -var environment=dev -var region=${{ inputs.region }} -out=tfplan
      # Lambdas need their container image to exist before they can be created:
      # create the ECR repository, push the image, then apply everything.
      - if: inputs.apply
        run: terraform apply -input=false -auto-approve -var environment=dev -var region=${{ inputs.region }} -target=aws_ecr_repository.pipeline
      - if: inputs.apply
        id: image
        run: |
          repo=$(terraform output -raw ecr_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${repo%%/*}"
          docker build -f ../../Dockerfile.lambda -t "$repo:${GITHUB_SHA::12}" ../..
          docker push "$repo:${GITHUB_SHA::12}"
          echo "uri=$repo:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - if: inputs.apply
        run: terraform apply -input=false -auto-approve -var environment=dev -var region=${{ inputs.region }} -var lambda_image_uri=${{ steps.image.outputs.uri }}
